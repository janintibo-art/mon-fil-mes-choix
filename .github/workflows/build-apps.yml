name: Construire APK et EXE DNS
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'windows/**'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Installer SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler APK debug
        run: gradle -p android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MonFilMesChoix-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Vérifier syntaxe
        run: python -m py_compile windows/app.py
      - name: Tests Windows
        run: python -m unittest discover -s windows -p "test_*.py"
      - name: Compiler EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MonFilMesChoix_DNS --icon windows/assets/icone_antifa.ico --add-data 'windows/domaines_v1.json;.' windows/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: MonFilMesChoix-Windows-EXE
          path: dist/MonFilMesChoix_DNS.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [android, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MonFilMesChoix-Android-APK
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: MonFilMesChoix-Windows-EXE
          path: release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
