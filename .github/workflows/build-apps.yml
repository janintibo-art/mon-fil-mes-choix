name: Construire APK et EXE DNS
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'windows/**'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Installer SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler APK debug
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Préparer le nom stable de l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/MonFilMesChoix_DNS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MonFilMesChoix-Android-APK
          path: android/app/build/outputs/apk/debug/MonFilMesChoix_DNS.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Vérifier syntaxe
        run: python -m py_compile windows/app.py
      - name: Tests Windows
        run: python -m unittest discover -s windows -p "test_*.py"
      - name: Compiler EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MonFilMesChoix_DNS --icon windows/assets/icone_antifa.ico --add-data 'windows/domaines_v1.json;.' --add-data 'windows/selection_v14.json;.' windows/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: MonFilMesChoix-Windows-EXE
          path: dist/MonFilMesChoix_DNS.exe
          if-no-files-found: error
  release:
    # Un APK et un EXE doivent être disponibles avant publication.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [android, windows]
    permissions:
      contents: write
    steps:
      - name: Télécharger l'APK validé
        uses: actions/download-artifact@v4
        with:
          name: MonFilMesChoix-Android-APK
          path: release/
      - name: Télécharger l'EXE validé
        uses: actions/download-artifact@v4
        with:
          name: MonFilMesChoix-Windows-EXE
          path: release/
      - name: Déterminer la version de la Release
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=auto-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          fi
      - name: Vérifier les deux fichiers et calculer leurs empreintes
        shell: bash
        run: |
          test -s release/MonFilMesChoix_DNS.apk
          test -s release/MonFilMesChoix_DNS.exe
          cd release
          sha256sum MonFilMesChoix_DNS.apk MonFilMesChoix_DNS.exe > SHA256SUMS.txt
      - name: Publier la Release APK + EXE
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Mon fil, mes choix — ${{ steps.version.outputs.tag }}
          body: |
            Applications de filtrage local **Mon fil, mes choix**.

            - **Android** : télécharger `MonFilMesChoix_DNS.apk` (VPN DNS local).
            - **Windows** : télécharger `MonFilMesChoix_DNS.exe` (filtre hosts local).
            - `SHA256SUMS.txt` permet de contrôler les fichiers téléchargés.

            Installation et limites : https://janintibo-art.github.io/mon-fil-mes-choix/dns.html
            Les binaires ne sont pas signés commercialement. Filtrage réversible.
          files: |
            release/MonFilMesChoix_DNS.apk
            release/MonFilMesChoix_DNS.exe
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
          prerelease: false
