<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title>Capture d’écran illustrative — installer le script</title><desc>Page d’installation du script utilisateur avec le bouton Installer mis en évidence.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#091321"/><stop offset="100%" stop-color="#131626"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.25"/></filter></defs>
<rect width="1280" height="800" fill="url(#bg)"/>
<rect x="50" y="52" width="1180" height="696" rx="26" fill="#0a1321" stroke="#22344b" filter="url(#shadow)"/>
<rect x="50" y="52" width="1180" height="58" rx="26" fill="#0e1a2a"/>
<circle cx="92" cy="81" r="9" fill="#ff5f57"/><circle cx="120" cy="81" r="9" fill="#febc2e"/><circle cx="148" cy="81" r="9" fill="#28c840"/>
<text x="86" y="160" fill="#ff9fb0" font-family="Arial, sans-serif" font-size="18" font-weight="700">ÉTAPE 3</text>
<text x="86" y="216" fill="#fff" font-family="Arial, sans-serif" font-size="52" font-weight="800">Installer notre script</text>
<rect x="86" y="258" width="1108" height="434" rx="24" fill="#101c2d" stroke="#26384e"/>
<text x="126" y="320" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="800">Mon fil, mes choix.user.js</text>
<text x="126" y="360" fill="#8ca0b5" font-family="Consolas, monospace" font-size="22">// @name        Mon fil, mes choix</text>
<text x="126" y="394" fill="#8ca0b5" font-family="Consolas, monospace" font-size="22">// @match       *://*/*</text>
<text x="126" y="428" fill="#8ca0b5" font-family="Consolas, monospace" font-size="22">// @description Filtrage local des contenus et domaines</text>
<rect x="126" y="468" width="1028" height="150" rx="18" fill="#0b1524" stroke="#233349"/>
<text x="154" y="514" fill="#dce6ef" font-family="Arial, sans-serif" font-size="24">Tampermonkey affiche un écran d’installation avec le nom du script.</text>
<text x="154" y="558" fill="#dce6ef" font-family="Arial, sans-serif" font-size="24">Vérifiez que le nom correspond, puis validez l’installation.</text>
<text x="154" y="602" fill="#dce6ef" font-family="Arial, sans-serif" font-size="24">Si rien ne s’ouvre : copiez le script dans « Créer un script » puis Enregistrer.</text>
<rect x="854" y="618" width="300" height="58" rx="18" fill="#ff2d55"/>
<text x="1004" y="655" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="800">Installer</text>
</svg>